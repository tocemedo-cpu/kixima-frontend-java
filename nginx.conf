# Serve o SPA e reencaminha /api para o backend Java (mesmo papel do proxy do
# Vite em desenvolvimento). O nome de host "backend" é o serviço do
# docker-compose/orquestrador — ajusta ao nome real do serviço Java.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API -> backend Java
  location /api/ {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Healthcheck do backend Java — expõe /actuator/health (Spring Boot
  # Actuator), não /health como o Node.
  location = /health {
    proxy_pass http://backend:4001/actuator/health;
  }

  # Tempo real (Chat de Suporte/Comercial, notificações) — STOMP sobre
  # WebSocket nativo (WebSocketConfig.java no backend, endpoint /ws). Sem
  # Upgrade/Connection aqui, o Nginx nunca faz o handshake e devolve 200 com
  # o corpo normal (cai no location / de baixo) em vez de 101 — o pedido
  # fica a parecer bem-sucedido e não é: só se nota ao reparar que a ligação
  # WebSocket nunca chega a abrir.
  location /ws {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A ligação fica aberta indefinidamente (STOMP, não um pedido pontual) —
    # sem isto o Nginx fecha-a ao fim de 60s por omissão mesmo sem tráfego.
    proxy_read_timeout 3600s;
  }

  # Fallback de SPA: qualquer rota do React devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
