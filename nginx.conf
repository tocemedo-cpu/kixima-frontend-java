# Serve o SPA e reencaminha /api para o backend Java (mesmo papel do proxy do
# Vite em desenvolvimento). O nome de host "backend" é o serviço do
# docker-compose/orquestrador — ajusta ao nome real do serviço Java.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API -> backend Java
  location /api/ {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Healthcheck do backend Java — expõe /actuator/health (Spring Boot
  # Actuator), não /health como o Node.
  location = /health {
    proxy_pass http://backend:4001/actuator/health;
  }

  # Fallback de SPA: qualquer rota do React devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
